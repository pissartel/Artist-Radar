name: Run Artist Radar CLI

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        required: true
        default: 'npm run dev -- booking --artist "Tuesday Fall" --genre "pop punk" --target "France" --limit 10'
        type: string

jobs:
  run-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare outputs
        run: mkdir -p outputs

      - name: Run command
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          set -o pipefail

          echo "Running command:"
          echo '${{ github.event.inputs.command }}'

          bash -lc '${{ github.event.inputs.command }}' \
            2>&1 | tee outputs/logs.txt

          if [ ! -f outputs/result.json ]; then
            echo '{"status":"completed","note":"No result.json generated. Check logs.txt."}' > outputs/result.json
          fi

      - name: Upload logs and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-output
          path: outputs/
          if-no-files-found: warn
