name: Run Artist Radar CLI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode"
        required: true
        default: "booking"
        type: choice
        options:
          - booking
          - promo

      artist:
        description: "Artist name"
        required: true
        default: "Tuesday Fall"
        type: string

      city:
        description: "Artist city"
        required: true
        default: "Paris"
        type: string

      genre:
        description: "Artist genre"
        required: true
        default: "pop punk"
        type: string

      target:
        description: "Target region or country"
        required: true
        default: "grandes villes françaises"
        type: string

      limit:
        description: "Maximum number of opportunities"
        required: true
        default: "20"
        type: string

      enable_openagenda:
        description: "ENABLE_OPENAGENDA"
        required: true
        default: true
        type: boolean

      openagenda_agenda_uids:
        description: "Optional comma-separated OpenAgenda agenda UID override"
        required: false
        default: ""
        type: string

      enable_scene_agendas:
        description: "ENABLE_SCENE_AGENDAS"
        required: true
        default: true
        type: boolean

      enable_concerts_punk:
        description: "ENABLE_CONCERTS_PUNK"
        required: true
        default: true
        type: boolean

      enable_punknroll_agenda:
        description: "ENABLE_PUNKNROLL_AGENDA"
        required: true
        default: true
        type: boolean

      enable_razibus:
        description: "ENABLE_RAZIBUS"
        required: true
        default: true
        type: boolean

      enable_france_punk_scene:
        description: "ENABLE_FRANCE_PUNK_SCENE"
        required: true
        default: true
        type: boolean

      enable_concerts_metal:
        description: "ENABLE_CONCERTS_METAL"
        required: true
        default: false
        type: boolean

      spotify_url:
        description: "Spotify artist URL"
        required: false
        default: "https://open.spotify.com/intl-fr/artist/2RO6dHJK11CKcEg1G7XYps?si=V7yX1-_LQQidabHNXS67HA"
        type: string

      youtube_url:
        description: "YouTube channel or artist URL"
        required: false
        default: "https://www.youtube.com/@TUESDAYFALL"
        type: string

      instagram_url:
        description: "Instagram profile URL"
        required: false
        default: "https://www.instagram.com/tuesdayfall/"
        type: string

      links:
        description: "Comma-separated extra artist links"
        required: false
        default: ""
        type: string

      consolidate_similar_artists:
        description: "CONSOLIDATE_SIMILAR_ARTISTS"
        required: true
        default: true
        type: boolean

      consolidate_similar_artists_limit:
        description: "CONSOLIDATE_SIMILAR_ARTISTS_LIMIT"
        required: true
        default: "20"
        type: string

      enable_firecrawl_consolidation:
        description: "ENABLE_FIRECRAWL_CONSOLIDATION"
        required: true
        default: true
        type: boolean

      debug_firecrawl:
        description: "DEBUG_FIRECRAWL"
        required: false
        default: true
        type: boolean

      debug_artist_consolidation:
        description: "DEBUG_ARTIST_CONSOLIDATION"
        required: false
        default: true
        type: boolean

      debug_similar_artists:
        description: "DEBUG_SIMILAR_ARTISTS"
        required: false
        default: true
        type: boolean

jobs:
  run-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare outputs
        run: mkdir -p outputs

      - name: Run Artist Radar CLI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ENABLE_OPENAGENDA: ${{ github.event.inputs.enable_openagenda }}
          OPENAGENDA_AGENDA_UIDS: ${{ github.event.inputs.openagenda_agenda_uids }}
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          ENABLE_SCENE_AGENDAS: ${{ github.event.inputs.enable_scene_agendas }}
          ENABLE_CONCERTS_PUNK: ${{ github.event.inputs.enable_concerts_punk }}
          ENABLE_PUNKNROLL_AGENDA: ${{ github.event.inputs.enable_punknroll_agenda }}
          ENABLE_RAZIBUS: ${{ github.event.inputs.enable_razibus }}
          ENABLE_FRANCE_PUNK_SCENE: ${{ github.event.inputs.enable_france_punk_scene }}
          ENABLE_CONCERTS_METAL: ${{ github.event.inputs.enable_concerts_metal }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

          MODE: ${{ github.event.inputs.mode }}
          ARTIST: ${{ github.event.inputs.artist }}
          CITY: ${{ github.event.inputs.city }}
          GENRE: ${{ github.event.inputs.genre }}
          TARGET: ${{ github.event.inputs.target }}
          LIMIT: ${{ github.event.inputs.limit }}
          SPOTIFY_URL: ${{ github.event.inputs.spotify_url }}
          YOUTUBE_URL: ${{ github.event.inputs.youtube_url }}
          INSTAGRAM_URL: ${{ github.event.inputs.instagram_url }}
          LINKS: ${{ github.event.inputs.links }}

          CONSOLIDATE_SIMILAR_ARTISTS: ${{ github.event.inputs.consolidate_similar_artists }}
          CONSOLIDATE_SIMILAR_ARTISTS_LIMIT: ${{ github.event.inputs.consolidate_similar_artists_limit }}
          ENABLE_FIRECRAWL_CONSOLIDATION: ${{ github.event.inputs.enable_firecrawl_consolidation }}
          DEBUG_FIRECRAWL: ${{ github.event.inputs.debug_firecrawl }}
          DEBUG_ARTIST_CONSOLIDATION: ${{ github.event.inputs.debug_artist_consolidation }}
          DEBUG_SIMILAR_ARTISTS: ${{ github.event.inputs.debug_similar_artists }}

        run: |
          set -o pipefail

          CMD=(npm run dev -- "$MODE"
            --artist "$ARTIST"
            --city "$CITY"
            --genre "$GENRE"
            --target "$TARGET"
            --limit "$LIMIT"
          )

          if [ -n "$SPOTIFY_URL" ]; then
            CMD+=(--spotify-url "$SPOTIFY_URL")
          fi

          if [ -n "$YOUTUBE_URL" ]; then
            CMD+=(--youtube-url "$YOUTUBE_URL")
          fi

          if [ -n "$INSTAGRAM_URL" ]; then
            CMD+=(--instagram-url "$INSTAGRAM_URL")
          fi

          if [ -n "$LINKS" ]; then
            CMD+=(--links "$LINKS")
          fi

          echo "Running command:"
          printf '%q ' "${CMD[@]}"
          echo

          echo "Environment flags:"
          echo "CONSOLIDATE_SIMILAR_ARTISTS=$CONSOLIDATE_SIMILAR_ARTISTS"
          echo "CONSOLIDATE_SIMILAR_ARTISTS_LIMIT=$CONSOLIDATE_SIMILAR_ARTISTS_LIMIT"
          echo "ENABLE_FIRECRAWL_CONSOLIDATION=$ENABLE_FIRECRAWL_CONSOLIDATION"
          echo "ENABLE_OPENAGENDA=$ENABLE_OPENAGENDA"
          echo "ENABLE_SCENE_AGENDAS=$ENABLE_SCENE_AGENDAS"
          echo "ENABLE_CONCERTS_PUNK=$ENABLE_CONCERTS_PUNK"
          echo "ENABLE_PUNKNROLL_AGENDA=$ENABLE_PUNKNROLL_AGENDA"
          echo "ENABLE_RAZIBUS=$ENABLE_RAZIBUS"
          echo "ENABLE_FRANCE_PUNK_SCENE=$ENABLE_FRANCE_PUNK_SCENE"
          echo "ENABLE_CONCERTS_METAL=$ENABLE_CONCERTS_METAL"
          echo "DEBUG_FIRECRAWL=$DEBUG_FIRECRAWL"
          echo "DEBUG_ARTIST_CONSOLIDATION=$DEBUG_ARTIST_CONSOLIDATION"
          echo "DEBUG_SIMILAR_ARTISTS=$DEBUG_SIMILAR_ARTISTS"

          if [ "$ENABLE_OPENAGENDA" = "true" ] && [ -z "$OPENAGENDA_API_KEY" ]; then
            echo "::warning::ENABLE_OPENAGENDA is true but OPENAGENDA_API_KEY secret is missing; OpenAgenda will be disabled gracefully."
          fi

          "${CMD[@]}" 2>&1 | tee outputs/logs.txt

      - name: Upload logs and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artist-radar-output
          path: outputs/
          if-no-files-found: warn
